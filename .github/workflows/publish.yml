name: 发布签名桌面版本

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（必须与源码中的版本一致，如 0.2.0）"
        required: true
        type: string
      source_ref:
        description: "私有源码仓库的分支、标签或提交"
        required: true
        default: "main"
        type: string
      release_notes:
        description: "本次更新说明"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ inputs.version }}
      source_ref: ${{ inputs.source_ref }}
    secrets: inherit

  build:
    name: 构建 Windows x64
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: 读取私有源码
        uses: actions/checkout@v4
        with:
          repository: zeyu06408-gif/document-quality-inspector
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 pnpm
        id: pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: 恢复 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 配置 Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: 恢复 Rust 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-x86_64-pc-windows-msvc-

      - name: 核对版本号
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const expected=process.env.RELEASE_VERSION; const pkg=JSON.parse(fs.readFileSync("package.json")); const conf=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")); const cargo=fs.readFileSync("src-tauri/Cargo.toml","utf8").match(/^version = "([^"]+)"/m)?.[1]; const versions=[pkg.version,conf.version,cargo]; if(versions.some(v=>v!==expected)){console.error(`版本不一致：期望 ${expected}，实际 ${versions.join(" / ")}`); process.exit(1)}'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 清除缓存中的旧安装包
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          if (Test-Path $bundle) { Remove-Item -Recurse -Force $bundle }

      - name: 构建 Windows 安装包
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: 整理 Windows 发布文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $ErrorActionPreference = "Stop"
          $product = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName
          $installer = Get-Item -LiteralPath "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/${product}_${env:RELEASE_VERSION}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath "$($installer.FullName).sig")) { throw "缺少更新签名" }
          $expectedVersions = @($env:RELEASE_VERSION, "$($env:RELEASE_VERSION).0")
          if ($installer.VersionInfo.ProductVersion -notin $expectedVersions) { throw "安装包内部版本不匹配：$($installer.VersionInfo.ProductVersion)" }
          $verifyDir = Join-Path $env:RUNNER_TEMP "verify-windows-installer"
          if (Test-Path $verifyDir) { Remove-Item -Recurse -Force $verifyDir }
          & 7z x $installer.FullName "-o$verifyDir" -y
          if ($LASTEXITCODE -ne 0) { throw "解包验证失败" }
          $extracted = @(Get-ChildItem $verifyDir -Recurse -Filter document-quality-inspector.exe)
          if ($extracted.Count -ne 1) { throw "解包主程序数量异常" }
          $compiled = Get-Item -LiteralPath "src-tauri/target/x86_64-pc-windows-msvc/release/document-quality-inspector.exe"
          if ($compiled.VersionInfo.ProductVersion -notin $expectedVersions) { throw "编译主程序版本不匹配" }
          $installDir = Join-Path $env:RUNNER_TEMP "dqi-install-verification"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          # Exercise the actual NSIS installation path in this disposable runner.
          # /NS prevents shortcuts; omit /R so the application is never launched.
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/NS', "/D=$installDir") -PassThru
          if (-not $process.WaitForExit(300000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "静默安装超过 5 分钟，停止发布"
          }
          if ($process.ExitCode -ne 0) { throw "静默安装失败：$($process.ExitCode)" }
          $installed = Get-Item -LiteralPath (Join-Path $installDir 'document-quality-inspector.exe')
          $compiledHash = (Get-FileHash -LiteralPath $compiled.FullName -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash -LiteralPath $installed.FullName -Algorithm SHA256).Hash
          $extractedHash = (Get-FileHash -LiteralPath $extracted[0].FullName -Algorithm SHA256).Hash
          $report = [ordered]@{
            version = $env:RELEASE_VERSION
            installerVersion = $installer.VersionInfo.ProductVersion
            compiledVersion = $compiled.VersionInfo.ProductVersion
            installedVersion = $installed.VersionInfo.ProductVersion
            compiledSha256 = $compiledHash
            installedSha256 = $installedHash
            extractedSha256 = $extractedHash
            compiledBytes = $compiled.Length
            installedBytes = $installed.Length
            extractedBytes = $extracted[0].Length
          }
          $report | ConvertTo-Json | Tee-Object -FilePath "release-assets/windows-verification.json"
          if ($installed.VersionInfo.ProductVersion -notin $expectedVersions) { throw "实际安装主程序版本不匹配" }
          if ($installedHash -ne $compiledHash) { throw "实际安装主程序与本次编译产物不一致，停止发布" }
          if ($extractedHash -ne $compiledHash) { Write-Warning "第三方解压结果不同；实际静默安装的主程序已通过逐字节哈希核验" }
          Write-Host "安装包及实际安装主程序验证通过：$env:RELEASE_VERSION"
          Copy-Item $installer.FullName "release-assets/document-quality-inspector_${env:RELEASE_VERSION}_x64-setup.exe"
          Copy-Item "$($installer.FullName).sig" "release-assets/document-quality-inspector_${env:RELEASE_VERSION}_x64-setup.exe.sig"

      - name: 保留 Windows 验证诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-diagnostics
          path: |
            release-assets/windows-verification.json
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/document-quality-inspector.exe
            ${{ runner.temp }}/verify-windows-installer/**/document-quality-inspector.exe
            ${{ runner.temp }}/dqi-install-verification/document-quality-inspector.exe
          if-no-files-found: warn
          retention-days: 3

      - name: 暂存平台产物
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: 验证并发布
    needs: [build, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: 读取更新仓库
        uses: actions/checkout@v4
        with:
          path: publisher

      - name: 汇总构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: 生成更新清单
        shell: bash
        run: |
          set -euo pipefail
          windows_file="document-quality-inspector_${RELEASE_VERSION}_x64-setup.exe"
          windows_cdn_file="${windows_file}.bin"
          mac_file="document-quality-inspector_${RELEASE_VERSION}_aarch64.app.tar.gz"
          download_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/updates/v${RELEASE_VERSION}"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg notes "$RELEASE_NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_signature "$(tr -d '\r\n' < "release-assets/${windows_file}.sig")" \
            --arg windows_url "${download_base}/${windows_cdn_file}" \
            --arg mac_signature "$(tr -d '\r\n' < "release-assets/${mac_file}.sig")" \
            --arg mac_url "${download_base}/${mac_file}" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{"windows-x86_64":{signature:$windows_signature,url:$windows_url},"darwin-aarch64":{signature:$mac_signature,url:$mac_url}}}' \
            > release-assets/latest.json

      - name: 发布更新文件
        shell: bash
        run: |
          set -euo pipefail
          git -C publisher pull --rebase origin main
          version_dir="publisher/updates/v${RELEASE_VERSION}"
          mkdir -p "$version_dir"
          cp release-assets/document-quality-inspector_${RELEASE_VERSION}_x64-setup.exe \
            "$version_dir/document-quality-inspector_${RELEASE_VERSION}_x64-setup.exe.bin"
          cp "release-assets/document-quality-inspector_${RELEASE_VERSION}_aarch64.app.tar.gz" "$version_dir/"
          cp release-assets/latest.json publisher/latest.json
          cd publisher
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json "updates/v${RELEASE_VERSION}"
          git commit -m "release: publish CDN files for ${RELEASE_VERSION}"
          git push origin HEAD:main

      - name: 刷新 CDN 更新清单
        shell: bash
        run: |
          for path in \
            "latest.json" \
            "updates/v${RELEASE_VERSION}/document-quality-inspector_${RELEASE_VERSION}_x64-setup.exe.bin"
          do
            curl --fail --silent --show-error \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${path}"
          done

      - name: 验证客户端更新地址
        shell: bash
        run: |
          set -euo pipefail
          raw_endpoint="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/latest.json"
          actual=""
          for attempt in $(seq 1 6); do
            actual="$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "${raw_endpoint}?run=${GITHUB_RUN_ID}-${attempt}" | jq -r '.version // empty' || true)"
            if [ "$actual" = "$RELEASE_VERSION" ]; then
              echo "低缓存客户端更新地址已返回 ${RELEASE_VERSION}"
              break
            fi
            echo "第 ${attempt} 次 Raw 校验仍返回 ${actual:-无版本}，5 秒后重试"
            sleep 5
          done
          if [ "$actual" != "$RELEASE_VERSION" ]; then
            echo "低缓存客户端更新地址未返回 ${RELEASE_VERSION}，拒绝宣告发布成功" >&2
            exit 1
          fi

          # Verify the actual installer route, not only the manifest version.
          download_url="$(jq -r '.platforms["windows-x86_64"].url' release-assets/latest.json)"
          curl --fail --location --silent --show-error --connect-timeout 20 --max-time 300 \
            "$download_url" -o /tmp/verified-update.bin
          cmp "release-assets/document-quality-inspector_${RELEASE_VERSION}_x64-setup.exe" /tmp/verified-update.bin
          rm /tmp/verified-update.bin
          mac_url="$(jq -r '.platforms["darwin-aarch64"].url' release-assets/latest.json)"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 300 \
            "$mac_url" -o /tmp/verified-mac-update.tar.gz
          cmp "release-assets/document-quality-inspector_${RELEASE_VERSION}_aarch64.app.tar.gz" /tmp/verified-mac-update.tar.gz
          rm /tmp/verified-mac-update.tar.gz

          cdn_endpoint="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/latest.json"
          cdn_actual="$(curl --fail --silent --show-error "$cdn_endpoint" | jq -r '.version // empty' || true)"
          if [ "$cdn_actual" = "$RELEASE_VERSION" ]; then
            echo "CDN 备用更新地址已返回 ${RELEASE_VERSION}"
          else
            echo "::warning::CDN 备用更新地址暂时返回 ${cdn_actual:-无版本}；已发布的 Raw 主更新地址正常，不阻断 Release。"
          fi

      - name: 创建 GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="app-v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "版本 ${tag} 已存在，拒绝覆盖。" >&2
            exit 1
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "文书质检 v${RELEASE_VERSION}" \
            --notes "$RELEASE_NOTES" \
            --latest
